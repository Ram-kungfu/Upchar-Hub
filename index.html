<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upchar Hub: Global Expert Digital Doctor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        header {
            background-color: #00796b;
            color: white;
            padding: 12px 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .header-btns button {
            background: white;
            color: #00796b;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            margin-left: 5px;
        }
        /* कीपैड से बॉक्स छिपने से बचाने के लिए इनपुट बॉक्स ऊपर सेट है */
        #input-container {
            display: flex;
            padding: 10px;
            background-color: #ffffff;
            border-bottom: 1px solid #ccc;
            align-items: center;
            flex-shrink: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        #user-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            outline: none;
        }
        .action-btn {
            background-color: #00796b;
            color: white;
            border: none;
            padding: 12px 15px;
            margin-left: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        #mic-btn.listening {
            background-color: #d9534f;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 85%;
            padding: 12px;
            border-radius: 10px;
            line-height: 1.5;
            font-size: 16px;
            word-wrap: break-word;
        }
        .user-message {
            background-color: #d1e7dd;
            align-self: flex-end;
            color: #0f5132;
        }
        .bot-message {
            background-color: #ffffff;
            align-self: flex-start;
            color: #333;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .speak-btn {
            background: none;
            border: none;
            color: #00796b;
            cursor: pointer;
            font-size: 13px;
            margin-top: 5px;
            display: inline-block;
            font-weight: bold;
        }
        .footer-note {
            text-align: center;
            font-size: 12px;
            color: #d9534f;
            padding: 6px;
            background: #fff;
            font-weight: bold;
            flex-shrink: 0;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>

<header>
    <span>🩺 Upchar Hub</span>
    <div class="header-btns">
        <button onclick="clearHistory()">नया चैट</button>
        <button onclick="shareChat()">शेयर करें</button>
    </div>
</header>

<div id="input-container">
    <input type="text" id="user-input" placeholder="अपनी समस्या यहाँ बताएं या बोलें..." onkeypress="handleKeyPress(event)">
    <button id="mic-btn" class="action-btn" onclick="toggleSpeechRecognition()" title="बोलकर पूछें">🎙️</button>
    <button id="send-btn" class="action-btn" onclick="sendMessage()">भेजें</button>
</div>

<div id="chat-container">
    <div class="message bot-message" id="welcome-msg">
        नमस्ते! मैं उपचार हब का डिजिटल डॉक्टर हूँ। मुझे Ram Bhai द्वारा आपकी सेहत की देखभाल के लिए बनाया गया है। मैं आपकी कैसे मदद कर सकता हूँ?
        <br><button class="speak-btn" onclick="speakText(this.parentNode.innerText.replace('🔊 सुनें', '').trim())">🔊 सुनें</button>
    </div>
</div>

<div class="footer-note">🚨 आपातकाल में 108/102 डायल करें</div>

<script>
    // आपकी नई OAuth / Access Token क्रेडेंशियल
    const API_KEY = "AQ.Ab8RN6Kgm9fzUHJErC_ZhIzdJhxKH1f_CrdqoKMimw21HtqhAA"; 

    const systemPrompt = `तुम 'Upchar Hub' के एक विशेषज्ञ डिजिटल डॉक्टर हो। तुम्हारा स्वभाव बहुत ही धैर्यवान, विनम्र और मददगार है। 
    जब कोई मरीज़ तुमसे बात करे, तो इन चरणों का पालन करो:
    1. लक्षणों का विश्लेषण: मरीज़ के लक्षणों को ध्यान से सुनो और ज़रूरत पड़ने पर 1-2 और सवाल पूछो।
    2. संभावित बीमारी: लक्षणों के आधार पर बीमारी का नाम बताओ।
    3. दवा और डोज़ (Dose): बीमारी के लिए सामान्य दवा, लेने का समय और डोज़ स्पष्ट रूप से बताओ।
    4. साइड इफेक्ट्स: दवा से होने वाले सामान्य नुकसान जैसे नींद आना या जी मिचलाना के बारे में आगाह करो।
    5. परहेज और घरेलू उपाय: क्या खाना चाहिए और क्या नहीं, इसकी सलाह दो।
    6. डिस्क्लेमर (अनिवार्य): अंत में यह ज़रूर कहो कि 'मैं एक AI हूँ, गंभीर स्थिति में तुरंत डॉक्टर के पास जाएँ और दवा बिना डॉक्टरी पर्ची के न लें।'
    भाषा: बातचीत को सरल और हिंदी में रखो।`;

    let chatHistory = [];

    window.onload = function() {
        const savedHistory = localStorage.getItem('upchar_hub_history_v7');
        if (savedHistory) {
            chatHistory = JSON.parse(savedHistory);
            const chatContainer = document.getElementById('chat-container');
            chatContainer.innerHTML = ''; 
            
            chatHistory.forEach(chat => {
                appendMessageToDOM(chat.role === 'user' ? 'user-message' : 'bot-message', chat.text);
            });
        }
    };

    function appendMessageToDOM(className, text) {
        const chatContainer = document.getElementById('chat-container');
        const div = document.createElement('div');
        div.className = `message ${className}`;
        
        if (className === 'bot-message') {
            div.innerHTML = text.replace(/\n/g, '<br>') + `<br><button class="speak-btn" onclick="speakText(this.parentNode.innerText.replace('🔊 सुनें', '').trim())">🔊 सुनें</button>`;
        } else {
            div.textContent = text;
        }
        
        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function sendMessage(customText = null) {
        const inputField = document.getElementById('user-input');
        const text = customText || inputField.value.trim();
        if (!text) return;

        appendMessageToDOM('user-message', text);
        if (!customText) inputField.value = '';

        chatHistory.push({ role: 'user', text: text });

        const chatContainer = document.getElementById('chat-container');
        const botDiv = document.createElement('div');
        botDiv.className = 'message bot-message';
        botDiv.textContent = "डॉक्टर सोच रहे हैं...";
        chatContainer.appendChild(botDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;

        try {
            const contents = chatHistory.map(item => ({
                role: item.role === 'user' ? 'user' : 'model',
                parts: [{ text: item.text }]
            }));

            contents[0].parts[0].text = systemPrompt + "\n\nमरीज़ का सवाल: " + contents[0].parts[0].text;

            // यहाँ Bearer Token ऑथेंटिकेशन का इस्तेमाल किया गया है ताकि 'AQ.' से शुरू होने वाला टोकन सही से काम करे
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${API_KEY}`
                },
                body: JSON.stringify({ contents: contents })
            });

            const data = await response.json();
            
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                const reply = data.candidates[0].content.parts[0].text;
                botDiv.innerHTML = `${reply.replace(/\n/g, '<br>')} <br><button class="speak-btn" onclick="speakText(this.parentNode.innerText.replace('🔊 सुनें', '').trim())">🔊 सुनें</button>`;
                
                chatHistory.push({ role: 'model', text: reply });
                localStorage.setItem('upchar_hub_history_v7', JSON.stringify(chatHistory));

                speakText(reply);
            } else if (data.error) {
                botDiv.textContent = "एरर: " + (data.error.message || "कृपया टोकन की जाँच करें।");
            } else {
                botDiv.textContent = "माफ़ कीजिए, सर्वर से उत्तर प्राप्त नहीं हुआ।";
            }

        } catch (error) {
            botDiv.textContent = "माफ़ कीजिए, नेटवर्क या कनेक्शन में कुछ दिक्कत है।";
        }
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }

    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const cleanText = text.replace(/🔊 सुनें/g, '').replace(/🚨 आपातकाल में 108/g, '');
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'hi-IN';
            window.speechSynthesis.speak(utterance);
        }
    }

    let recognition;
    function toggleSpeechRecognition() {
        const micBtn = document.getElementById('mic-btn');
        const inputField = document.getElementById('user-input');

        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            alert("आपका ब्राउज़र बोलकर टाइप करने की सुविधा सपोर्ट नहीं करता है।");
            return;
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'hi-IN';
        recognition.interimResults = false;

        recognition.onstart = function() {
            micBtn.classList.add('listening');
            inputField.placeholder = "सुन रहे हैं, बोलिए...";
        };

        recognition.onresult = function(event) {
            const speechToText = event.results[0][0].transcript;
            inputField.value = speechToText;
            sendMessage(speechToText);
        };

        recognition.onerror = function() {
            micBtn.classList.remove('listening');
            inputField.placeholder = "अपनी समस्या यहाँ बताएं या बोलें...";
        };

        recognition.onend = function() {
            micBtn.classList.remove('listening');
            inputField.placeholder = "अपनी समस्या यहाँ बताएं या बोलें...";
        };

        recognition.start();
    }

    function clearHistory() {
        if (confirm("क्या आप नया चैट शुरू करना चाहते हैं?")) {
            localStorage.removeItem('upchar_hub_history_v7');
            location.reload();
        }
    }

    function shareChat() {
        if (chatHistory.length === 0) {
            alert("शेयर करने के लिए कोई बातचीत उपलब्ध नहीं है।");
            return;
        }
        let shareText = "--- Upchar Hub Consultation ---\n\n";
        chatHistory.forEach(item => {
            shareText += (item.role === 'user' ? "मरीज़: " : "डॉक्टर: ") + item.text + "\n\n";
        });

        if (navigator.share) {
            navigator.share({ title: 'Upchar Hub Chat', text: shareText }).catch(() => {});
        } else {
            navigator.clipboard.writeText(shareText);
            alert("चैट कॉपी हो गई है!");
        }
    }
</script>

</body>
</html>
