<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upchar Hub: Global Expert Digital Doctor</title>
<style>
body {
font-family: Arial, sans-serif;
background-color: #f0f4f8;
margin: 0;
padding: 0;
display: flex;
flex-direction: column;
height: 100vh;
box-sizing: border-box;
}
header {
background-color: #00796b;
color: white;
padding: 12px 15px;
text-align: center;
font-size: 18px;
font-weight: bold;
display: flex;
justify-content: space-between;
align-items: center;
flex-shrink: 0;
}
.header-btns button {
background: white;
color: #00796b;
border: none;
padding: 5px 10px;
border-radius: 4px;
cursor: pointer;
font-size: 12px;
font-weight: bold;
margin-left: 5px;
}
#input-container {
display: flex;
padding: 10px;
background-color: #ffffff;
border-bottom: 1px solid #ccc;
align-items: center;
flex-shrink: 0;
box-shadow: 0 2px 5px rgba(0,0,0,0.05);
gap: 5px;
}
#user-input {
flex: 1;
padding: 12px;
border: 1px solid #ccc;
border-radius: 5px;
font-size: 16px;
outline: none;
}
.action-btn {
background-color: #00796b;
color: white;
border: none;
padding: 12px 15px;
border-radius: 5px;
cursor: pointer;
font-size: 16px;
display: flex;
align-items: center;
justify-content: center;
}
#mic-btn.listening {
background-color: #d9534f;
animation: pulse 1s infinite;
}
@keyframes pulse {
0% { opacity: 1; }
50% { opacity: 0.5; }
100% { opacity: 1; }
}
#chat-container {
flex: 1;
overflow-y: auto;
padding: 15px;
display: flex;
flex-direction: column;
gap: 15px;
}
.message {
max-width: 85%;
padding: 12px;
border-radius: 10px;
line-height: 1.5;
font-size: 16px;
word-wrap: break-word;
}
.user-message {
background-color: #d1e7dd;
align-self: flex-end;
color: #0f5132;
}
.bot-message {
background-color: #ffffff;
align-self: flex-start;
color: #333;
box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}
.msg-actions {
margin-top: 8px;
display: flex;
gap: 10px;
align-items: center;
}
.speak-btn, .share-btn {
background: #e0f2f1;
border: 1px solid #b2dfdb;
color: #00796b;
cursor: pointer;
padding: 4px 8px;
border-radius: 4px;
font-size: 12px;
font-weight: bold;
}
.footer-note {
text-align: center;
font-size: 12px;
color: #d9534f;
padding: 6px;
background: #fff;
font-weight: bold;
flex-shrink: 0;
border-top: 1px solid #eee;
display: flex;
justify-content: space-around;
align-items: center;
}
#image-preview {
max-height: 60px;
border-radius: 4px;
display: none;
margin-right: 5px;
}
</style>
</head>
<body>

<header>
<span>🩺 Upchar Hub</span>
<div class="header-btns">
<button onclick="changeApiKey()">API Key</button>
<button onclick="clearHistory()">नया चैट</button>
<button onclick="shareChat()">शेयर करें</button>
</div>
</header>

<div id="input-container">
<input type="file" id="image-input" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
<button class="action-btn" onclick="document.getElementById('image-input').click()" title="रिपोर्ट या फोटो अपलोड करें">📷</button>
<img id="image-preview" alt="Preview">
<input type="text" id="user-input" placeholder="अपनी समस्या यहाँ बताएं या रिपोर्ट अपलोड करें..." onkeypress="handleKeyPress(event)">
<button id="mic-btn" class="action-btn" onclick="toggleSpeechRecognition()" title="बोलकर पूछें">🎙️</button>
<button id="send-btn" class="action-btn" onclick="sendMessage()">भेजें</button>
</div>

<div id="chat-container">
<div class="message bot-message" id="welcome-msg">
नमस्ते! मैं उपचार हब का डिजिटल डॉक्टर हूँ। मुझे Ram Bhai द्वारा आपकी सेहत की देखभाल के लिए बनाया गया है। मैं आपकी कैसे मदद कर सकता हूँ?
<br><div class="msg-actions"><button class="speak-btn" onclick="speakText(this.parentNode.parentNode.innerText)">🔊 सुनें</button></div>
</div>
</div>

<div class="footer-note">
<span>🚨 आपातकाल में 108/102 डायल करें</span>
<label style="font-weight: normal; font-size: 11px; cursor: pointer;">
<input type="checkbox" id="auto-speak-toggle" checked> ऑटो-आवाज़ चालू रखें
</label>
</div>

<script>
let API_KEY = localStorage.getItem('upchar_hub_api_key') || "";

if (!API_KEY) {
    API_KEY = prompt("सुरक्षा कारणों से, कृपया अपनी Google Gemini API Key दर्ज करें:");
    if (API_KEY) {
        localStorage.setItem('upchar_hub_api_key', API_KEY.trim());
    }
}

function changeApiKey() {
    let newKey = prompt("अपनी नई API Key दर्ज करें:", API_KEY);
    if (newKey) {
        localStorage.setItem('upchar_hub_api_key', newKey.trim());
        API_KEY = newKey.trim();
        alert("API Key सफलतापूर्वक सेव हो गई है!");
    }
}

// सख्त और विस्तृत एमबीबीएस डॉक्टर प्रिस्क्रिप्शन प्रॉम्प्ट
const systemPrompt = `तुम 'Upchar Hub' के एक वरिष्ठ और विशेषज्ञ एमबीबीएस डॉक्टर (Senior MBBS Doctor) हो। जब कोई मरीज़ अपनी समस्या, लक्षण या मेडिकल रिपोर्ट की फोटो भेजे, तो जवाब देते समय इस सख्त क्रम (Sequence) का पालन करो:
1. क्लिनिकल डायग्नोसिस (संभावित बीमारी या रिपोर्ट की सटीक पहचान)।
2. भाग 1: एलोपैथिक दवाइयां (Allopathic Prescription - Rx): सबसे पहले सटीक दवा का नाम, पावर/स्ट्रेंथ (जैसे 500mg), सटीक खुराक (Dosage), कितने समय अंतराल पर लेनी है, खाने के पहले या बाद में, और सेवन की अवधि स्पष्ट रूप से लिखो।
3. साइड इफेक्ट्स और ओवरडोज चेतावनी: दवा से होने वाले सामान्य नुकसान (जैसे नींद आना, जी मिचलाना) तथा ज्यादा खाने या ओवरडोज के गंभीर खतरों के बारे में जरूर आगाह करो।
4. भाग 2: आयुर्वेदिक या होम्योपैथिक विकल्प।
5. भाग 3: पारंपरिक घरेलू उपाय और परहेज (क्या खाएं और क्या न खाएं)।
6. अनिवार्य चिकित्सीय चेतावनी (Disclaimer): स्पष्ट लिखो कि 'मैं एक AI स्वास्थ्य सहायक हूँ, गंभीर स्थिति में तुरंत नजदीकी डॉक्टर या अस्पताल जाएं।'
भाषा पूरी तरह स्पष्ट और सरल हिंदी/हिंग्लिश में होनी चाहिए।`;

let chatHistory = [];
let attachedImageBase64 = null;

window.onload = function() {
    const savedHistory = localStorage.getItem('upchar_hub_history_v8');
    if (savedHistory) {
        chatHistory = JSON.parse(savedHistory);
        const chatContainer = document.getElementById('chat-container');
        chatContainer.innerHTML = '';
        
        chatHistory.forEach(chat => {
            appendMessageToDOM(chat.role === 'user' ? 'user-message' : 'bot-message', chat.text, chat.img);
        });
    }
};

function handleImageUpload(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            attachedImageBase64 = e.target.result;
            const preview = document.getElementById('image-preview');
            preview.src = attachedImageBase64;
            preview.style.display = 'block';
        };
        reader.readAsDataURL(file);
    }
}

function appendMessageToDOM(className, text, imgData = null) {
    const chatContainer = document.getElementById('chat-container');
    const div = document.createElement('div');
    div.className = `message ${className}`;

    let contentHTML = "";
    if (imgData) {
        contentHTML += `<img src="${imgData}" style="max-width:100%; border-radius:5px; margin-bottom:8px;"><br>`;
    }
    contentHTML += text.replace(/\n/g, '<br>');

    if (className === 'bot-message') {
        contentHTML += `<br><div class="msg-actions">
            <button class="speak-btn" onclick="speakText(this.parentNode.parentNode.innerText)">🔊 सुनें</button>
            <button class="share-btn" onclick="shareSingleMessage('${text.replace(/'/g, "\\'")}')">📤 शेयर</button>
        </div>`;
    }

    div.innerHTML = contentHTML;
    chatContainer.appendChild(div);
    chatContainer.scrollTop = chatContainer.scrollHeight;
}

async function sendMessage(customText = null) {
    if (!API_KEY) {
        changeApiKey();
        return;
    }

    const inputField = document.getElementById('user-input');
    const text = customText || inputField.value.trim();
    if (!text && !attachedImageBase64) return;

    let currentImg = attachedImageBase64;
    appendMessageToDOM('user-message', text || "[तस्वीर/रिपोर्ट भेजी गई]", currentImg);
    
    if (!customText) inputField.value = '';
    document.getElementById('image-preview').style.display = 'none';
    attachedImageBase64 = null;
    document.getElementById('image-input').value = "";

    chatHistory.push({ role: 'user', text: text, img: currentImg });

    const chatContainer = document.getElementById('chat-container');
    const botDiv = document.createElement('div');
    botDiv.className = 'message bot-message';
    botDiv.textContent = "डॉक्टर पर्ची और सलाह तैयार कर रहे हैं...";
    chatContainer.appendChild(botDiv);
    chatContainer.scrollTop = chatContainer.scrollHeight;

    try {
        let partsArray = [];
        partsArray.push({ text: systemPrompt + "\n\nमरीज़ का सवाल/विवरण: " + (text || "कृपया इस मेडिकल रिपोर्ट या तस्वीर की जाँच करके एमबीबीएस डॉक्टर की पर्ची दें।") });

        if (currentImg) {
            const base64Data = currentImg.split(',')[1];
            partsArray.push({
                inlineData: {
                    mimeType: "image/jpeg",
                    data: base64Data
                }
            });
        }

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${API_KEY}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: partsArray }] })
        });

        const data = await response.json();

        if (data.candidates && data.candidates[0].content.parts[0].text) {
            const reply = data.candidates[0].content.parts[0].text;
            
            botDiv.innerHTML = reply.replace(/\n/g, '<br>') + `<br><div class="msg-actions">
                <button class="speak-btn" onclick="speakText(this.parentNode.parentNode.innerText)">🔊 सुनें</button>
                <button class="share-btn" onclick="shareSingleMessage('${reply.replace(/'/g, "\\'")}')">📤 शेयर</button>
            </div>`;

            chatHistory.push({ role: 'model', text: reply, img: null });
            localStorage.setItem('upchar_hub_history_v8', JSON.stringify(chatHistory));

            if (document.getElementById('auto-speak-toggle').checked) {
                speakText(reply);
            }
        } else if (data.error) {
            botDiv.textContent = "एरर: " + (data.error.message || "कृपया अपनी API Key की जाँच करें।");
        } else {
            botDiv.textContent = "माफ़ कीजिए, सर्वर से उत्तर प्राप्त नहीं हुआ।";
        }

    } catch (error) {
        botDiv.textContent = "माफ़ कीजिए, नेटवर्क या कनेक्शन में कुछ दिक्कत है।";
    }
    chatContainer.scrollTop = chatContainer.scrollHeight;
}

function handleKeyPress(event) {
    if (event.key === 'Enter') {
        sendMessage();
    }
}

function speakText(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const cleanText = text.replace(/🔊 सुनें/g, '').replace(/📤 शेयर/g, '').replace(/🚨 आपातकाल में 108\/102 डायल करें/g, '');
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'hi-IN';
        window.speechSynthesis.speak(utterance);
    }
}

let recognition;
function toggleSpeechRecognition() {
    const micBtn = document.getElementById('mic-btn');
    const inputField = document.getElementById('user-input');

    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert("आपका ब्राउज़र बोलकर टाइप करने की सुविधा सपोर्ट नहीं करता है।");
        return;
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.lang = 'hi-IN';
    recognition.interimResults = false;

    recognition.onstart = function() {
        micBtn.classList.add('listening');
        inputField.placeholder = "सुन रहे हैं, बोलिए...";
    };

    recognition.onresult = function(event) {
        const speechToText = event.results[0][0].transcript;
        inputField.value = speechToText;
        sendMessage(speechToText);
    };

    recognition.onerror = function() {
        micBtn.classList.remove('listening');
        inputField.placeholder = "अपनी समस्या यहाँ बताएं या बोलें...";
    };

    recognition.onend = function() {
        micBtn.classList.remove('listening');
        inputField.placeholder = "अपनी समस्या यहाँ बताएं या बोलें...";
    };

    recognition.start();
}

function clearHistory() {
    if (confirm("क्या आप नया चैट शुरू करना चाहते हैं?")) {
        localStorage.removeItem('upchar_hub_history_v8');
        location.reload();
    }
}

function shareSingleMessage(text) {
    const cleanText = "🩺 *Upchar Hub - मेडिकल परामर्श*\n\n" + text;
    if (navigator.share) {
        navigator.share({ title: 'Upchar Hub Prescription', text: cleanText }).catch(() => {});
    } else {
        navigator.clipboard.writeText(cleanText);
        alert("पर्ची/सलाह क्लिपबोर्ड पर कॉपी हो गई है!");
    }
}

function shareChat() {
    if (chatHistory.length === 0) {
        alert("शेयर करने के लिए कोई बातचीत उपलब्ध नहीं है।");
        return;
    }
    let shareText = "--- Upchar Hub Consultation ---\n\n";
    chatHistory.forEach(item => {
        shareText += (item.role === 'user' ? "मरीज़: " : "डॉक्टर: ") + item.text + "\n\n";
    });

    if (navigator.share) {
        navigator.share({ title: 'Upchar Hub Chat', text: shareText }).catch(() => {});
    } else {
        navigator.clipboard.writeText(shareText);
        alert("पूरी चैट कॉपी हो गई है!");
    }
}
</script>

</body>
</html>
